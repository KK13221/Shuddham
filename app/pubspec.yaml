name: shuddham
description: Shuddham RO purifier app – Bluetooth setup, live TDS and temperature.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  # BLE communication for ESP32 custom GATT Wi-Fi provisioning
  flutter_blue_plus: ^1.34.4
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app-icon-1024.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app-icon-android-foreground.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
