name: shuddham
description: Shuddham RO purifier app – Bluetooth setup, live TDS and temperature.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  # Espressif unified Wi-Fi provisioning over BLE (ESP32 wifi_provisioning component, security 1 with PoP).
  flutter_esp_ble_prov: ^0.1.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
