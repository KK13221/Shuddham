<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in with email – Shuddham</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A5C;background:#F4F7FB}
a{color:#1553B8}a:hover{color:#0F3F8F}
</style>
<style>html{background:#E9EEF5}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FB; display: flex; flex-direction: column; padding: 60px 24px 40px; gap: 24px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Login.html" aria-label="Back to mobile log in" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #D5DEEB; display: flex; align-items: center; justify-content: center; color: #0F2A5C; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<img src="../assets/logo-mark.png" alt="Shuddham" style="width: 44px; height: 45px; display: block">
<span style="width: 44px"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700">Log in with email</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #56627A">Use the email and password linked to your Shuddham account.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="em" style="font-size: 14px; font-weight: 600">Email</label>
<input id="em" type="email" autocomplete="email" value="name@example.com" style="height: 56px; box-sizing: border-box; border: 2px solid #1553B8; border-radius: 14px; padding: 0 16px; font-family: inherit; font-size: 17px; background: #FFFFFF; color: #0F2A5C">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<label for="pw" style="font-size: 14px; font-weight: 600">Password</label>
<a href="#forgot" style="font-size: 14px; font-weight: 600; text-decoration: none">Forgot password?</a>
</div>
<div style="display: flex; align-items: center; height: 56px; background: #FFFFFF; border: 1px solid #C3CFE0; border-radius: 14px; padding: 0 6px 0 16px; box-sizing: border-box">
<input id="pw" type="password" autocomplete="current-password" placeholder="Enter password" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 17px; color: #0F2A5C">
<button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; color: #56627A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: #FDECEA; border-radius: 12px; font-size: 14px; line-height: 20px; color: #9B1C1C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5M12 16.5h.01"></path></svg>
<span>Email or password is incorrect. 4 attempts left.</span>
</div>
</div>
<a href="HomeSingle.html" style="height: 56px; border-radius: 16px; background: #1553B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Log in</a>
<a href="Login.html" style="height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #C3CFE0; color: #0F2A5C; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>Use mobile number instead</a>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center">
<p style="margin: 0; font-size: 15px; color: #56627A">New to Shuddham? <a href="Signup.html" style="font-weight: 600; text-decoration: none">Create an account</a></p>
</div>
</div>
</body>
</html>
