<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash – Shuddham</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A5C;background:#FFFFFF}
a{color:#1553B8}a:hover{color:#0F3F8F}
@keyframes sh-drop{0%{transform:translateY(-260px) scale(.55);opacity:0}18%{opacity:1}30%{transform:translateY(0) scale(1.06,.94)}37%{transform:translateY(-10px) scale(.98,1.02)}44%,88%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(0) scale(1);opacity:0}}
@keyframes sh-ripple{0%,30%{transform:translateX(-50%) scale(.2);opacity:0}34%{opacity:.7}70%,100%{transform:translateX(-50%) scale(1.9);opacity:0}}
@keyframes sh-word{0%,42%{transform:translateY(18px);opacity:0}56%,88%{transform:translateY(0);opacity:1}100%{opacity:0}}
@keyframes sh-bar{0%,45%{width:0}85%,100%{width:100%}}
.sh-drop{animation:sh-drop 4.2s cubic-bezier(.3,.7,.3,1) infinite}
.sh-ripple{animation:sh-ripple 4.2s ease-out infinite}
.sh-ripple2{animation-delay:.25s}
.sh-word{animation:sh-word 4.2s ease-out infinite}
.sh-bar{animation:sh-bar 4.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sh-drop,.sh-ripple,.sh-word,.sh-bar{animation:none}.sh-ripple{opacity:0}}
</style>
<style>html{background:#E9EEF5}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden">
<div style="position: relative; width: 190px; height: 192px">
<span class="sh-ripple" style="position: absolute; left: 50%; bottom: 8px; width: 170px; height: 34px; border: 2px solid #1E73D8; border-radius: 50%; box-sizing: border-box"></span>
<span class="sh-ripple sh-ripple2" style="position: absolute; left: 50%; bottom: 8px; width: 170px; height: 34px; border: 2px solid #173A8C; border-radius: 50%; box-sizing: border-box"></span>
<img class="sh-drop" src="../assets/logo-mark.png" alt="Shuddham logo" style="position: relative; width: 190px; height: 192px; display: block">
</div>
<img class="sh-word" src="../assets/logo-wordmark.png" alt="Shuddham Water Solutions" style="width: 260px; height: 52px; margin-top: 26px; display: block">
<div style="position: absolute; left: 0; right: 0; bottom: 64px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="width: 120px; height: 4px; border-radius: 2px; background: #E4ECF7; overflow: hidden">
<div class="sh-bar" style="height: 4px; border-radius: 2px; background: #1553B8"></div>
</div>
<a href="Login.html" style="font-size: 13px; color: #56627A; text-decoration: underline">Prototype: continue →</a>
</div>
</div>
</body>
</html>
