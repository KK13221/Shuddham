<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up – Shuddham</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A5C;background:#F4F7FB}
a{color:#1553B8}a:hover{color:#0F3F8F}
</style>
<style>html{background:#E9EEF5}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FB; display: flex; flex-direction: column; padding: 60px 24px 36px; gap: 22px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Login.html" aria-label="Back to log in" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #D5DEEB; display: flex; align-items: center; justify-content: center; color: #0F2A5C; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<img src="../assets/logo-mark.png" alt="Shuddham" style="width: 44px; height: 45px; display: block">
<span style="width: 44px"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700">Create your account</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #56627A">Track your purifier’s TDS and temperature, and get alerts when something’s off.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nm" style="font-size: 14px; font-weight: 600">Full name</label>
<input id="nm" type="text" autocomplete="name" placeholder="Your name" style="height: 52px; box-sizing: border-box; border: 1px solid #C3CFE0; border-radius: 14px; padding: 0 16px; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #0F2A5C">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="mob" style="font-size: 14px; font-weight: 600">Mobile number</label>
<div style="display: flex; align-items: center; height: 52px; background: #FFFFFF; border: 1px solid #C3CFE0; border-radius: 14px; box-sizing: border-box; overflow: hidden">
<span style="height: 100%; display: flex; align-items: center; padding: 0 14px; font-size: 16px; font-weight: 500; border-right: 1px solid #D5DEEB">+91</span>
<input id="mob" type="tel" inputmode="numeric" placeholder="10-digit number" style="flex-grow: 1; min-width: 0; border: 0; outline: none; padding: 0 14px; background: transparent; font-family: inherit; font-size: 16px; color: #0F2A5C">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="em" style="font-size: 14px; font-weight: 600">Email <span style="font-weight: 400; color: #56627A">(optional)</span></label>
<input id="em" type="email" autocomplete="email" placeholder="name@example.com" style="height: 52px; box-sizing: border-box; border: 1px solid #C3CFE0; border-radius: 14px; padding: 0 16px; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #0F2A5C">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pin" style="font-size: 14px; font-weight: 600">Pincode</label>
<input id="pin" type="text" inputmode="numeric" placeholder="6-digit pincode" style="height: 52px; box-sizing: border-box; border: 1px solid #C3CFE0; border-radius: 14px; padding: 0 16px; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #0F2A5C">
<span style="font-size: 13px; color: #56627A">Used to assign service in your area.</span>
</div>
<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px; color: #56627A; min-height: 44px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: #1553B8">I agree to the Terms and Privacy Policy</label>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px; align-items: stretch">
<a href="Main.html" style="height: 56px; border-radius: 16px; background: #1553B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Create account</a>
<p style="margin: 0; font-size: 15px; color: #56627A; text-align: center">Already have an account? <a href="Login.html" style="font-weight: 600; text-decoration: none">Log in</a></p>
</div>
</div>
</body>
</html>
