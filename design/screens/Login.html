<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – Shuddham</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A5C;background:#F4F7FB}
a{color:#1553B8}a:hover{color:#0F3F8F}
</style>
<style>html{background:#E9EEF5}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FB; display: flex; flex-direction: column; padding: 72px 24px 40px; gap: 28px; overflow: hidden">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<img src="../../assets/logo-mark.png" alt="" style="width: 84px; height: 85px; display: block">
<img src="../../assets/logo-wordmark.png" alt="Shuddham Water Solutions" style="width: 200px; height: 40px; display: block">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; color: #0F2A5C">Welcome back</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #56627A">Log in with your mobile number. We’ll send you a one-time code.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mob" style="font-size: 14px; font-weight: 600">Mobile number</label>
<div style="display: flex; align-items: center; height: 56px; background: #FFFFFF; border: 2px solid #1553B8; border-radius: 14px; box-sizing: border-box; overflow: hidden">
<span style="height: 100%; display: flex; align-items: center; padding: 0 14px; font-size: 17px; font-weight: 500; border-right: 1px solid #D5DEEB; color: #0F2A5C">+91</span>
<input id="mob" type="tel" inputmode="numeric" placeholder="10-digit number" value="98765 43210" style="flex-grow: 1; min-width: 0; border: 0; outline: none; padding: 0 14px; background: transparent; font-family: inherit; font-size: 17px; color: #0F2A5C">
</div>
</div>
<a href="HomeSingle.html" style="height: 56px; border-radius: 16px; background: #1553B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Send OTP</a>
<div style="display: flex; align-items: center; gap: 12px; color: #56627A; font-size: 14px">
<span style="flex-grow: 1; height: 1px; background: #D5DEEB"></span>or<span style="flex-grow: 1; height: 1px; background: #D5DEEB"></span>
</div>
<a href="LoginEmail.html" style="height: 56px; border-radius: 16px; background: #FFFFFF; border: 1px solid #C3CFE0; color: #0F2A5C; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; text-decoration: none; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>Log in with email</a>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 14px">
<p style="margin: 0; font-size: 15px; color: #56627A">New to Shuddham? <a href="Signup.html" style="font-weight: 600; text-decoration: none">Create an account</a></p>
<p style="margin: 0; font-size: 12px; line-height: 18px; color: #56627A; text-align: center">By continuing you agree to our <a href="#terms">Terms</a> and <a href="#privacy">Privacy Policy</a>.</p>
</div>
</div>
</body>
</html>
