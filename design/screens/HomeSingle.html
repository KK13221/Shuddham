<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home – one purifier</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A5C;background:#F4F7FB}
a{color:#1553B8}a:hover{color:#0F3F8F}
</style>
<style>html{background:#E9EEF5}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FB; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 60px 24px 0; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.5px">Home</h1>
<a href="Permissions.html" aria-label="Add device" style="width: 44px; height: 44px; border-radius: 22px; background: #0F2A5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
</header>
<main style="flex-grow: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
<a href="DeviceDetail.html" style="display: flex; flex-direction: column; gap: 14px; padding: 22px; background: #0F2A5C; color: #FFFFFF; border-radius: 24px; text-decoration: none">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 17px; font-weight: 600">Kitchen purifier</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #B8C7E0"><span style="width: 8px; height: 8px; border-radius: 4px; background: #5BB8F5"></span>Online · updated 5 s ago</span>
</div>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8C7E0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</div>
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #B8C7E0">TDS · purified water</span>
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 76px; font-weight: 700; line-height: 76px; letter-spacing: -2px">42</span>
<span style="font-size: 22px; color: #B8C7E0">ppm</span>
</div>
<span style="font-size: 13px; font-weight: 600; color: #0F2A5C; background: #5BB8F5; padding: 6px 12px; border-radius: 20px">Within range</span>
</div>
<svg width="302" height="56" viewBox="0 0 302 56" fill="none" aria-label="TDS, last 24 hours"><line x1="0" y1="12" x2="302" y2="12" stroke="#4A6396" stroke-dasharray="4 4"></line><polyline points="0,40 25,42 50,38 75,40 100,36 125,38 150,34 175,37 200,35 225,38 250,36 275,39 302,37" stroke="#5BB8F5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline><line x1="0" y1="55" x2="302" y2="55" stroke="#2A4478"></line></svg>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #B8C7E0"><span>24 h ago</span><span>- - alert at 100 ppm</span><span>Now</span></div>
</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="padding: 16px; background: #FFFFFF; border: 1px solid #D5DEEB; border-radius: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #56627A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"></path></svg>Water temp</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700">26.5 °C</span>
</div>
<div style="padding: 16px; background: #FFFFFF; border: 1px solid #D5DEEB; border-radius: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #56627A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3s-6 6.5-6 11a6 6 0 0 0 12 0c0-4.5-6-11-6-11z"></path></svg>Input TDS</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700">380 <span style="font-size: 15px; font-weight: 500; color: #56627A">ppm</span></span>
</div>
</div>
<a href="Permissions.html" style="display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px dashed #9FB0C8; border-radius: 18px; text-decoration: none">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #E3EDFB; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="font-size: 15px; font-weight: 600">Add another purifier</span>
</a>
</main>
<nav style="display: flex; gap: 8px; border-top: 1px solid #D5DEEB; background: #FFFFFF; padding: 8px 24px 28px">
<a href="HomeSingle.html" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: #1553B8; font-size: 12px; font-weight: 600; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Devices</a>
<a href="Profile.html" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: #56627A; font-size: 12px; font-weight: 500; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
</nav>
</div>
</body>
</html>
