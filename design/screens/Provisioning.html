<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setting up device</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A5C;background:#F4F7FB}
a{color:#1553B8}a:hover{color:#0F3F8F}
</style>
<style>html{background:#E9EEF5}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FB; display: flex; flex-direction: column; padding: 60px 24px 40px; gap: 32px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 16px; height: 44px">
<div style="flex-grow: 1; display: flex; gap: 6px">
<div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1553B8"></div>
<div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1553B8"></div>
<div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #9DBBE8"></div>
</div>
<span style="font-size: 13px; color: #56627A; font-weight: 500">3 of 3</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; padding-top: 12px">
<div style="width: 140px; height: 140px; border-radius: 70px; border: 8px solid #E3EDFB; border-top-color: #1553B8; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #1553B8">
<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14 0"></path><path d="M1.5 9a16 16 0 0 1 21 0"></path><path d="M8.5 16.1a6 6 0 0 1 7 0"></path><circle cx="12" cy="20" r="1"></circle></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700">Connecting to Home_WiFi</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #56627A">Keep the app open and your phone near the device. This can take up to a minute.</p>
</div>
</div>
<ol style="margin: 0; padding: 20px; list-style: none; background: #FFFFFF; border: 1px solid #D5DEEB; border-radius: 18px; display: flex; flex-direction: column; gap: 18px">
<li style="display: flex; align-items: center; gap: 14px">
<span style="width: 28px; height: 28px; border-radius: 14px; background: #1553B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
<span style="font-size: 16px">Wi-Fi details sent securely</span>
</li>
<li style="display: flex; align-items: center; gap: 14px">
<span style="width: 28px; height: 28px; border-radius: 14px; border: 3px solid #E3EDFB; border-top-color: #1553B8; box-sizing: border-box; flex-shrink: 0"></span>
<span style="font-size: 16px; font-weight: 600">Device joining your network</span>
</li>
<li style="display: flex; align-items: center; gap: 14px; color: #56627A">
<span style="width: 28px; height: 28px; border-radius: 14px; border: 2px solid #C3CFE0; box-sizing: border-box; flex-shrink: 0"></span>
<span style="font-size: 16px">Connecting to cloud</span>
</li>
<li style="display: flex; align-items: center; gap: 14px; color: #56627A">
<span style="width: 28px; height: 28px; border-radius: 14px; border: 2px solid #C3CFE0; box-sizing: border-box; flex-shrink: 0"></span>
<span style="font-size: 16px">Receiving first reading</span>
</li>
</ol>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 8px">

<a href="SetupFailed.html" style="font-size: 13px; color: #56627A; text-decoration: underline">Prototype: failure →</a>
<a href="Main.html" style="height: 56px; width: 100%; border-radius: 16px; border: 1px solid #C3CFE0; background: #FFFFFF; color: #0F2A5C; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none; box-sizing: border-box">Cancel setup</a>
</div>
</div>
