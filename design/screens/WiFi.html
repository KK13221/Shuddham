<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect to Wi-Fi</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A5C;background:#F4F7FB}
a{color:#1553B8}a:hover{color:#0F3F8F}
</style>
<style>html{background:#E9EEF5}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FB; display: flex; flex-direction: column; padding: 60px 24px 40px; gap: 22px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 16px">
<a href="Scan.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #D5DEEB; display: flex; align-items: center; justify-content: center; color: #0F2A5C; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; gap: 6px">
<div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1553B8"></div>
<div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1553B8"></div>
<div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #D5DEEB"></div>
</div>
<span style="font-size: 13px; color: #56627A; font-weight: 500">2 of 3</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700">Connect to Wi-Fi</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #56627A">Networks your device can see. It works on 2.4 GHz only.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #D5DEEB; border-radius: 18px; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 60px; background: #E3EDFB">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1553B8" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14 0"></path><path d="M1.5 9a16 16 0 0 1 21 0"></path><path d="M8.5 16.1a6 6 0 0 1 7 0"></path><circle cx="12" cy="20" r="1"></circle></svg>
<span style="flex-grow: 1; font-size: 16px; font-weight: 600">Home_WiFi</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56627A" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1553B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 60px; border-top: 1px solid #E9EEF5">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A5C" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14 0"></path><path d="M8.5 16.1a6 6 0 0 1 7 0"></path><circle cx="12" cy="20" r="1"></circle></svg>
<span style="flex-grow: 1; font-size: 16px">Office_Guest</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56627A" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 60px; border-top: 1px solid #E9EEF5; color: #56627A">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14 0"></path><path d="M1.5 9a16 16 0 0 1 21 0"></path><path d="M8.5 16.1a6 6 0 0 1 7 0"></path><circle cx="12" cy="20" r="1"></circle></svg>
<span style="flex-grow: 1; font-size: 16px">Home_WiFi_5G</span>
<span style="font-size: 12px; font-weight: 600">5 GHz · not supported</span>
</div>
<a href="#other" style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px; border-top: 1px solid #E9EEF5; font-size: 15px; font-weight: 600; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Hidden or other network</a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pw" style="font-size: 14px; font-weight: 600">Password for Home_WiFi</label>
<div style="display: flex; align-items: center; height: 56px; background: #FFFFFF; border: 2px solid #0F2A5C; border-radius: 14px; padding: 0 6px 0 16px; box-sizing: border-box">
<input id="pw" type="password" value="password123" style="flex-grow: 1; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 17px; color: #0F2A5C; min-width: 0">
<button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; color: #56627A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #56627A; min-height: 44px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #1553B8">Save this network for my next devices</label>
</div>
<a href="Provisioning.html" style="margin-top: auto; height: 56px; border-radius: 16px; background: #1553B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Connect</a>
</div>
</body>
</html>
